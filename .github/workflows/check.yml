name: Sprawdzenie pakietu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Zakres sprawdzenia
        type: choice
        default: all
        options: [all, review]

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true

jobs:
  review-sandbox:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    name: Izolowana kontrola syntetycznego oddania
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgbuild
            any::testthat
            any::withr
      - name: Zbuduj paczkę i zaufany obraz z jawnych wejść
        shell: Rscript {0}
        run: |
          tarball <- pkgbuild::build('.', dest_path = tempdir(), manual = FALSE, vignettes = FALSE)
          invisible(processx::run(file.path(R.home('bin'), 'Rscript'), c('--vanilla', 'tools/kontrola/build.R', tarball), echo = TRUE, timeout = 1800))
          install.packages(tarball, repos = NULL, type = 'source')
      - name: Kontrola syntetycznych prac i ograniczeń kontenera
        shell: Rscript {0}
        run: source('tools/kontrola/verify.R', encoding = 'UTF-8')

  check:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'review'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        r: ['4.3', release]
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          install-pandoc: true
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-results: true
      - name: Instalacja z GitHub i dostęp lokalny
        shell: Rscript {0}
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: source("tools/verify-install.R", encoding = "UTF-8")

  render-smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'review'
    runs-on: ${{ matrix.os }}
    name: Render smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Render reprezentatywnego ćwiczenia i wykładu
        shell: Rscript {0}
        run: source("tools/verify-render.R", encoding = "UTF-8")

  render-full-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'review'
    runs-on: ubuntu-latest
    name: Pełny render HTML/PDF / Linux
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Render wszystkich materiałów
        shell: Rscript {0}
        env:
          RENDER_SCOPE: full
          RENDER_PDF: 'true'
        run: source("tools/verify-render.R", encoding = "UTF-8")
