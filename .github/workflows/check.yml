name: Sprawdzenie pakietu

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      wysylka:
        description: Wyślij próbny PDF z każdego systemu do folderu Z01
        type: boolean
        default: false
      render:
        description: Jednostki do przerenderowania na Windows (np. C01 C02); puste pomija render
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / R ${{ matrix.r }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        r: ['4.3', release]
    env:
      R_KEEP_PKG_SOURCE: 'yes'
      _R_CHECK_CRAN_INCOMING_REMOTE_: 'false'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::remotes
          install-pandoc: true
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-results: true
      - name: Instalacja z repozytorium pakietu i dostęp lokalny
        shell: Rscript {0}
        run: source("tools/verify-install.R", encoding = "UTF-8")

  student-flow:
    runs-on: ${{ matrix.os }}
    name: Przepływ studenta / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Połączenie z serwerem oddań
        continue-on-error: true
        shell: bash
        run: |
          curl -sS -o /dev/null --max-time 40 -w "IPv4: HTTP %{http_code}, połączenie %{time_connect} s, adres %{remote_ip}\n" -4 https://nc.uj.edu.pl/status.php || true
          curl -sS -o /dev/null --max-time 40 -w "domyślnie: HTTP %{http_code}, połączenie %{time_connect} s, adres %{remote_ip}\n" https://nc.uj.edu.pl/status.php || true
          curl -sS --max-time 20 https://api.ipify.org || true
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          # Binaria macOS z CRAN, tak jak u studenta korzystającego z RStudio.
          use-public-rspm: ${{ matrix.os != 'macos-latest' }}
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: TinyTeX z pakietu, start, PDF i oddanie
        shell: Rscript {0}
        env:
          WYSYLKA_TESTOWA: ${{ inputs.wysylka && 'true' || 'false' }}
        run: source("tools/verify-flow.R", encoding = "UTF-8")

  render-smoke:
    runs-on: ${{ matrix.os }}
    name: Render smoke / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Render reprezentatywnego ćwiczenia i wykładu
        shell: Rscript {0}
        run: source("tools/verify-render.R", encoding = "UTF-8")

  render-full-linux:
    runs-on: ubuntu-latest
    name: Pełny render HTML/PDF / Linux
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Render wszystkich materiałów
        shell: Rscript {0}
        env:
          RENDER_SCOPE: full
          RENDER_PDF: 'true'
        run: source("tools/verify-render.R", encoding = "UTF-8")

  render-materials:
    if: github.event_name == 'workflow_dispatch' && inputs.render != ''
    runs-on: windows-latest
    name: Render materiałów / Windows
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: website
      - name: Zainstaluj bieżący pakiet
        shell: Rscript {0}
        run: install.packages(".", repos = NULL, type = "source")
      - name: Render HTML i PDF
        shell: Rscript {0}
        env:
          JEDNOSTKI: ${{ inputs.render }}
        run: |
          jednostki <- strsplit(trimws(Sys.getenv("JEDNOSTKI")), "[[:space:],]+")[[1]]
          stopifnot(length(jednostki) > 0L, all(grepl("^[CW](0[1-9]|10)$", jednostki)))
          status <- system2(file.path(R.home("bin"), "Rscript"), c("tools/render.R", jednostki))
          stopifnot(identical(status, 0L))
      - uses: actions/upload-artifact@v4
        with:
          name: materialy
          path: |
            inst/materialy/*/pelne.html
            inst/materialy/*/pelne.pdf
            inst/materialy/*/handout.html
            inst/materialy/*/handout.pdf
            inst/materialy/*/handout.tex
