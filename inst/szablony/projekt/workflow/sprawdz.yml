name: Kontrola oddania

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Zainstaluj pakiet kursu
        shell: Rscript {0}
        run: |
          install.packages("remotes")
          remotes::install_github("MarekDejaUJ/projektowanie-badan-ZI@v1.0.0",
                                  dependencies = NA, upgrade = "never")
      - name: Sprawdź oddany zakres
        shell: Rscript {0}
        run: |
          library(badaniaZI)
          komunikat <- system2("git", c("log", "-1", "--pretty=%s"), stdout = TRUE)
          id <- toupper(sub("^Oddaj[[:space:]]+", "", komunikat))
          if (!grepl("^(Z(0[1-9]|10)|PROJEKT)$", id)) {
            cat("Commit inicjalny lub roboczy — brak zakresu oddania do kontroli.\n")
          } else {
            wynik <- sprawdz_zadanie(id, ".", uruchom = TRUE)
            print(wynik$kontrole)
            if (!wynik$ok) stop("Kontrola oddania wykazała elementy do poprawy.")
          }

