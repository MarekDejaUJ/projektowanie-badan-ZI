wersja: 1.1.0
scenariusze:
- id: S01
  tytul: 'Biblioteka akademicka: dostępność wsparcia w wyszukiwaniu'
  problem: "Biblioteka rozważa zmianę sposobu oferowania konsultacji. Chce rozpoznać deklarowaną pewność użytkowników i jej związek z korzystaniem z biblioteki, zanim uzna same wizyty na konsultacjach za dowód poprawy umiejętności."
  konstrukt: pewności wyszukiwania
  grupy:
  - konsultacje
  - bez konsultacji
  druga_analiza: Spearman
  pytanie_drugie: 'częstość wizyt a pewność: Spearman'
  zmienna_druga: czestosc_korzystania
  efekt_grup: 0.2
  czas_typowy: 5.0
  pozycje:
  - Wiem, jak rozpocząć wyszukiwanie dokumentów.
  - Potrafię wybrać właściwe źródło informacji.
  - Czuję się zagubiony podczas wyszukiwania.
  - Umiem zawęzić zapytanie, gdy wyników jest zbyt wiele.
  - Potrafię ocenić przydatność znalezionego dokumentu.
  - Wiem, gdzie szukać pomocy w wyszukiwaniu.
  pytanie_binarne: Czy udało się znaleźć potrzebny dokument?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
    syntetyczne, nie stanowią dowodu o instytucji.
  wersja_opisu: "1.1.0"
  nazwa_indeksu: "Deklarowana pewność wyszukiwania"
  etykiety_grup: ["konsultacje","bez konsultacji"]
  opis_grup: "Konsultacje: co najmniej jedna konsultacja wyszukiwawcza w ostatnim semestrze; bez konsultacji: żadna w tym okresie. To zastane doświadczenie, nie losowy przydział. Osoby szukające pomocy mogą już przed konsultacją różnić się trudnością zadania."
  zadanie_obserwacyjne: "W katalogu znajdź dokument odpowiadający podanemu tytułowi i autorowi oraz wskaż jego lokalizację."
  kontekst_pozycji: "Po zadaniu oceń zasób i własne doświadczenie korzystania. Pozycje dotyczące historii odnieś do ostatnich czterech tygodni. Jeśli treści nie da się ocenić, pozostaw brak zamiast zgadywać lub wybierać 3; ustal tę zasadę jednakowo dla obu grup."
  rodzaj_binarnego: "obserwacja"
  kod_1: "wskazano właściwy dokument i jego lokalizację"
  kod_0: "nie spełniono obu kryteriów w zakończonej, zarejestrowanej próbie"
  ograniczenie_binarnego: "Jedno poprawne zadanie nie mierzy całej kompetencji informacyjnej; wysoka pewność pozostaje deklaracją."
  nazwa_czasu: "Czas do zakończenia próby"
  protokol_czasu: "Od udostępnienia zadania do zgłoszenia odpowiedzi lub zakończenia próby, w minutach, niezależnie od jej wyniku. Czas nie jest automatycznie czasem dojścia do poprawnej odpowiedzi."
  opis_czestosci: "Deklarowana częstość korzystania z opisanego zasobu w ostatnich czterech tygodniach przed zadaniem: 1 nigdy, 2 rzadko, 3 czasami, 4 często, 5 bardzo często. Są to kategorie porządkowe, nie liczba wizyt."
  inspiracja: "[Kuhlthau (1991)](https://wp.comminfo.rutgers.edu/ckuhlthau2/wp-content/uploads/sites/185/2016/01/InsidetheSearchProcess.pdf): wykorzystaj pytanie o moment procesu wyszukiwania, w którym mierzysz pewność lub ocenę. Nie przypisuj autorce kursowego indeksu ani syntetycznych wyników."
- id: S02
  tytul: 'Katalog biblioteczny: użyteczność wyszukiwania'
  problem: "Biblioteka chce ustalić, czy katalog wymaga dodatkowego wsparcia przy pierwszych kontaktach. Porównuje ocenę katalogu i wykonanie jednego zadania, ponieważ pozytywna opinia o interfejsie nie musi oznaczać poprawnego odnalezienia dokumentu."
  konstrukt: użyteczności katalogu
  grupy:
  - nowi
  - doświadczeni
  druga_analiza: tabela krzyżowa
  pytanie_drugie: grupa × powodzenie znalezienia dokumentu
  zmienna_druga: powodzenie
  efekt_grup: 0.35
  czas_typowy: 9.0
  pozycje:
  - Szybko znajduję pole wyszukiwania w katalogu.
  - Nazwy filtrów są dla mnie zrozumiałe.
  - Odczytanie rekordu wymaga ode mnie zgadywania.
  - Potrafię znaleźć lokalizację dokumentu.
  - Komunikaty katalogu pomagają mi poprawić zapytanie.
  - Katalog wspiera wykonanie mojego zadania.
  pytanie_binarne: Czy udało się znaleźć wskazany dokument?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
    syntetyczne, nie stanowią dowodu o instytucji.
  wersja_opisu: "1.1.0"
  nazwa_indeksu: "Ocena użyteczności katalogu"
  etykiety_grup: ["nowi","doświadczeni"]
  opis_grup: "Nowi: korzystający z tego katalogu po raz pierwszy; doświadczeni: korzystający wcześniej. Doświadczenie dotyczy konkretnego katalogu, nie ogólnej sprawności cyfrowej. Rekrutacja tylko przy stanowisku pomocy może nadreprezentować osoby mające trudności."
  zadanie_obserwacyjne: "Znajdź wskazaną publikację i wskaż lokalizację egzemplarza lub właściwy dostęp elektroniczny."
  kontekst_pozycji: "Po zadaniu oceń zasób i własne doświadczenie korzystania. Pozycje dotyczące historii odnieś do ostatnich czterech tygodni. Jeśli treści nie da się ocenić, pozostaw brak zamiast zgadywać lub wybierać 3; ustal tę zasadę jednakowo dla obu grup."
  rodzaj_binarnego: "obserwacja"
  kod_1: "wskazano właściwą publikację i jej lokalizację lub dostęp"
  kod_0: "zakończono próbę bez poprawnego wskazania"
  ograniczenie_binarnego: "Wynik zależy od tego konkretnego zadania i katalogu; nie uzasadnia diagnozy wszystkich umiejętności użytkownika."
  nazwa_czasu: "Czas do zakończenia próby"
  protokol_czasu: "Od udostępnienia zadania do zgłoszenia odpowiedzi lub zakończenia próby, w minutach, niezależnie od jej wyniku. Czas nie jest automatycznie czasem dojścia do poprawnej odpowiedzi."
  opis_czestosci: "Deklarowana częstość korzystania z opisanego zasobu w ostatnich czterech tygodniach przed zadaniem: 1 nigdy, 2 rzadko, 3 czasami, 4 często, 5 bardzo często. Są to kategorie porządkowe, nie liczba wizyt."
  inspiracja: "[Hargittai (2002)](https://webuse.org/p/a09/): uzasadnij rozdzielenie deklaracji i obserwacji działania. Sześć pozycji oraz wyniki w tym scenariuszu nie pochodzą z narzędzia ani próby autorki."
- id: S03
  tytul: 'Repozytorium uczelni: znajomość zasad otwartego dostępu'
  problem: "Repozytorium chce poprawić instrukcje dotyczące znajdowania i udostępniania tekstów. Oddziela deklarowaną znajomość zasad od sprawdzenia konkretnego źródła; samo uczestnictwo w szkoleniu nie dowodzi wiedzy ani efektu szkolenia."
  konstrukt: znajomości zasad otwartego dostępu
  grupy:
  - przeszkoleni
  - nieprzeszkoleni
  druga_analiza: Spearman
  pytanie_drugie: 'częstość korzystania a indeks: korelacja'
  zmienna_druga: czestosc_korzystania
  efekt_grup: 0.5
  czas_typowy: 15.0
  pozycje:
  - Rozumiem różnicę między wersją wydawcy a preprintem.
  - Wiem, gdzie sprawdzić warunki udostępnienia tekstu.
  - Zasady otwartego dostępu są dla mnie niejasne.
  - Rozumiem, co określa licencja publikacji.
  - Potrafię rozpoznać legalne źródło otwartego tekstu.
  - Wiem, jak uzyskać pomoc w zdeponowaniu publikacji.
  pytanie_binarne: Czy udało się odnaleźć legalną otwartą wersję tekstu?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
    syntetyczne, nie stanowią dowodu o instytucji.
  wersja_opisu: "1.1.0"
  nazwa_indeksu: "Deklarowana znajomość zasad otwartego dostępu"
  etykiety_grup: ["przeszkoleni","nieprzeszkoleni"]
  opis_grup: "Przeszkoleni: uczestniczyli w szkoleniu repozytorium w ostatnim roku; nieprzeszkoleni: nie uczestniczyli. Udział nie był randomizowany; motywacja do publikowania lub wcześniejsze doświadczenie mogły wpływać na wybór szkolenia."
  zadanie_obserwacyjne: "Znajdź otwartą wersję wskazanego tekstu w przygotowanym zestawie źródeł i wskaż informację o podstawie udostępnienia."
  kontekst_pozycji: "Po zadaniu oceń zasób i własne doświadczenie korzystania. Pozycje dotyczące historii odnieś do ostatnich czterech tygodni. Jeśli treści nie da się ocenić, pozostaw brak zamiast zgadywać lub wybierać 3; ustal tę zasadę jednakowo dla obu grup."
  rodzaj_binarnego: "obserwacja"
  kod_1: "wybrano wersję i podstawę udostępnienia zgodne z przygotowanym kluczem zadania"
  kod_0: "zakończono próbę bez obu poprawnych wskazań"
  ograniczenie_binarnego: "Ocena według klucza dydaktycznego nie jest poradą prawną ani dowodem ogólnej znajomości wszystkich licencji."
  nazwa_czasu: "Czas do zakończenia próby"
  protokol_czasu: "Od udostępnienia zadania do zgłoszenia odpowiedzi lub zakończenia próby, w minutach, niezależnie od jej wyniku. Czas nie jest automatycznie czasem dojścia do poprawnej odpowiedzi."
  opis_czestosci: "Deklarowana częstość korzystania z opisanego zasobu w ostatnich czterech tygodniach przed zadaniem: 1 nigdy, 2 rzadko, 3 czasami, 4 często, 5 bardzo często. Są to kategorie porządkowe, nie liczba wizyt."
  inspiracja: "[Hargittai (2002)](https://webuse.org/p/a09/): uzasadnij rozdzielenie deklaracji i obserwacji działania. Sześć pozycji oraz wyniki w tym scenariuszu nie pochodzą z narzędzia ani próby autorki."
- id: S04
  tytul: 'Biblioteka publiczna: dopasowanie kanału informacji o wydarzeniach'
  problem: "Biblioteka publiczna porównuje doświadczenia odbiorców informacji przez WWW i media społecznościowe. Chce odróżnić łatwość znalezienia komunikatu od deklarowanego udziału w wydarzeniu, na który wpływają też termin, zainteresowania i dostępność miejsca."
  konstrukt: łatwości dotarcia do informacji
  grupy:
  - WWW
  - media społecznościowe
  druga_analiza: tabela krzyżowa
  pytanie_drugie: "główny kanał × deklarowany udział w wydarzeniu"
  zmienna_druga: powodzenie
  efekt_grup: 0.2
  czas_typowy: 5.0
  pozycje:
  - Bez trudności znajduję datę wydarzenia.
  - Informacja wskazuje miejsce wydarzenia.
  - Muszę długo szukać warunków uczestnictwa.
  - Komunikat pozwala sprawdzić aktualność terminu.
  - Wybrany kanał pozwala mi wrócić do informacji.
  - Dowiaduję się o zmianach programu na czas.
  pytanie_binarne: Czy uczestniczyłeś w wydarzeniu?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
    syntetyczne, nie stanowią dowodu o instytucji.
  wersja_opisu: "1.1.0"
  nazwa_indeksu: "Ocena łatwości dotarcia do informacji o wydarzeniach"
  etykiety_grup: ["WWW","media społecznościowe"]
  opis_grup: "WWW i media społecznościowe oznaczają jeden deklarowany główny kanał szukania informacji o wydarzeniach. To nie są wszystkie zaznaczenia pytania wielokrotnego; dana osoba może korzystać także z innych kanałów."
  zadanie_obserwacyjne: "Znajdź datę, miejsce i warunki udziału w wskazanym wydarzeniu, korzystając z przygotowanego komunikatu."
  kontekst_pozycji: "Po zadaniu oceń zasób i własne doświadczenie korzystania. Pozycje dotyczące historii odnieś do ostatnich czterech tygodni. Jeśli treści nie da się ocenić, pozostaw brak zamiast zgadywać lub wybierać 3; ustal tę zasadę jednakowo dla obu grup."
  rodzaj_binarnego: "deklaracja"
  kod_1: "zadeklarowano udział w co najmniej jednym wydarzeniu tej biblioteki w ostatnich czterech tygodniach"
  kod_0: "zadeklarowano brak takiego udziału"
  ograniczenie_binarnego: "Udział jest wspomnieniem respondenta, a nie obserwowanym sukcesem zadania ani dowodem działania wybranego kanału."
  nazwa_czasu: "Czas do zakończenia próby"
  protokol_czasu: "Od udostępnienia zadania do zgłoszenia odpowiedzi lub zakończenia próby, w minutach, niezależnie od jej wyniku. Czas nie jest automatycznie czasem dojścia do poprawnej odpowiedzi."
  opis_czestosci: "Deklarowana częstość korzystania z opisanego zasobu w ostatnich czterech tygodniach przed zadaniem: 1 nigdy, 2 rzadko, 3 czasami, 4 często, 5 bardzo często. Są to kategorie porządkowe, nie liczba wizyt."
  inspiracja: "[Wilson (1999)](https://www.informationr.net/tdw/publ/papers/1999JDoc.html): odróżnij wybrany epizod korzystania od szerszego zachowania informacyjnego. Karta jest przykładem dydaktycznym, nie narzędziem zwalidowanym w tej publikacji."
- id: S05
  tytul: 'Portal studencki: odnajdywanie procedur administracyjnych'
  problem: "Zespół portalu studenckiego chce ułatwić odnajdywanie właściwych formularzy. Porównuje ocenę przejrzystości między osobami o różnym stażu studiowania i sprawdza jej związek z czasem, nie utożsamiając krótkiej próby z poprawnym załatwieniem sprawy."
  konstrukt: przejrzystości procedur
  grupy:
  - pierwszy rok
  - kolejny rok
  druga_analiza: Spearman
  pytanie_drugie: czas szukania a przejrzystość
  zmienna_druga: czas_wyszukiwania
  efekt_grup: 0.35
  czas_typowy: 9.0
  pozycje:
  - Nazwy procedur odpowiadają moim sprawom.
  - Widzę, od którego kroku rozpocząć sprawę.
  - Nie wiem, które formularze dotyczą mojej sprawy.
  - Portal jasno podaje wymagane dokumenty.
  - Potrafię znaleźć termin realizacji sprawy.
  - Wiem, do kogo skierować pytanie o procedurę.
  pytanie_binarne: Czy udało się odnaleźć właściwy formularz?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
    syntetyczne, nie stanowią dowodu o instytucji.
  wersja_opisu: "1.1.0"
  nazwa_indeksu: "Ocena przejrzystości procedur"
  etykiety_grup: ["pierwszy rok","kolejny rok"]
  opis_grup: "Pierwszy rok i kolejny rok odnoszą się do czasu studiowania w tej uczelni. Nie oznaczają wieku, trybu studiów ani pierwszego użycia dowolnego portalu. W planie uwzględnij możliwe różnice rodzaju spraw załatwianych przez grupy."
  zadanie_obserwacyjne: "W portalu odszukaj formularz i wymagane załączniki dla jednej opisanej sprawy administracyjnej."
  kontekst_pozycji: "Po zadaniu oceń zasób i własne doświadczenie korzystania. Pozycje dotyczące historii odnieś do ostatnich czterech tygodni. Jeśli treści nie da się ocenić, pozostaw brak zamiast zgadywać lub wybierać 3; ustal tę zasadę jednakowo dla obu grup."
  rodzaj_binarnego: "obserwacja"
  kod_1: "wskazano formularz właściwy dla opisanej sprawy"
  kod_0: "zakończono próbę bez wskazania właściwego formularza"
  ograniczenie_binarnego: "Czas dotyczy zakończenia próby, nie uzyskania decyzji administracyjnej. Drugie pytanie rdzenia dotyczy czasu, a nie wyniku 0/1."
  nazwa_czasu: "Czas do zakończenia próby"
  protokol_czasu: "Od udostępnienia zadania do zgłoszenia odpowiedzi lub zakończenia próby, w minutach, niezależnie od jej wyniku. Czas nie jest automatycznie czasem dojścia do poprawnej odpowiedzi."
  opis_czestosci: "Deklarowana częstość korzystania z opisanego zasobu w ostatnich czterech tygodniach przed zadaniem: 1 nigdy, 2 rzadko, 3 czasami, 4 często, 5 bardzo często. Są to kategorie porządkowe, nie liczba wizyt."
  inspiracja: "[Vial (2019)](https://doi.org/10.1016/j.jsis.2019.01.003): rozważ, jak odróżnić udostępnienie cyfrowej funkcji od zmiany działania usługi. Porównanie przekrojowe na danych syntetycznych nie dowodzi transformacji instytucji."
- id: S06
  tytul: 'Newsletter instytucji: informacyjne dopasowanie treści'
  problem: "Instytucja rozważa zmianę układu i doboru treści newslettera. Chce oddzielić ocenę jego przydatności od deklaracji wykorzystania informacji; otwarcie wiadomości lub kliknięcie linku nie przesądza o użyciu treści."
  konstrukt: przydatności newslettera
  grupy:
  - regularni
  - okazjonalni
  druga_analiza: tabela krzyżowa
  pytanie_drugie: "grupa × deklarowane wykorzystanie informacji"
  zmienna_druga: powodzenie
  efekt_grup: 0.5
  czas_typowy: 15.0
  pozycje:
  - Newsletter odpowiada na moje potrzeby informacyjne.
  - Tytuły wiadomości pomagają wybrać treść.
  - Większość treści jest dla mnie nieprzydatna.
  - Linki prowadzą do szczegółowych informacji.
  - Potrafię wykorzystać informacje z newslettera.
  - Częstotliwość newslettera pasuje do moich potrzeb.
  pytanie_binarne: Czy wykorzystałeś informację z newslettera?
  kanaly:
  - strona WWW
  - e-mail
  - media społecznościowe
  - kontakt bezpośredni
  projekt_badania: Obserwacyjne badanie przekrojowe; grupy nie są randomizowane.
  regula_indeksu: "Gotowy skrypt oznacza 99 jako NA, odwraca pozycję 3 jako 6-x i oblicza średnią przy minimum 5 z 6 ważnych odpowiedzi. Student odczytuje i uzasadnia tę regułę."
  ograniczenia: Pozycje są przykładem dydaktycznym, nie zwalidowaną skalą. Dane są
